; PHP settings for the online image (deploy/api/Dockerfile).
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
max_execution_time = 60
; FILE_MAX_BYTES is 10 MB; a little room for the multipart envelope.
upload_max_filesize = 12M
post_max_size = 14M
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
; The image's code never changes while it runs.
opcache.validate_timestamps = 0
