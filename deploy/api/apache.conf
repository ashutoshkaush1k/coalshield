# The API's Apache site in the online image (deploy/api/Dockerfile). Render sets PORT.
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/app/api/web

    <Directory /var/www/app/api/web>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Every request that is not a file goes to Yii's entry point (web/ holds only index.php).
        FallbackResource /index.php
    </Directory>

    # The bearer token reaches PHP (some Apache builds drop the Authorization header).
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Logs to the container's output, which Render shows under Logs.
    ErrorLog /proc/self/fd/2
    LogLevel warn
    CustomLog /proc/self/fd/1 "%a %t \"%r\" %>s %b %D"
    ServerSignature Off
</VirtualHost>

ServerTokens Prod
