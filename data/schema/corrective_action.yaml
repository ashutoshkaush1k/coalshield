  - "CLAUDE_CODE_TASK.md Phase 3: nullable contractor_id on corrective_action"
  - "CLAUDE_CODE_DATASETS.md D4: realistic closure times, some overdue (needs due_at)"
generator: gen_inspections.py
primary_key: id
columns:
