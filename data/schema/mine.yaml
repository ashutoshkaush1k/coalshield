table: mine
description: The mine roster selected by config.yaml mine_roster (real = reference/mines_real.csv, seed = reference/mines.csv).
defined_by:
  - "CLAUDE_CODE_TASK.md Phase 1: mine (code, name, type opencast/underground, location geometry(Point,4326), boundary geometry(Polygon,4326) nullable, status)"
  - "prototype app/models/mine.py: district, state, region (kept - the region filter and dashboards use them)"
  - "PLAN.md Q8 (location nullable) - superseded: the adopted real roster has exact GEM points"
generator: gen_org.py
primary_key: id
columns:
  - {name: id, type: integer, nullable: false, note: "seed slot id 1-74, stable across rosters"}
  - {name: code, type: string, nullable: false, unique: true}
  - {name: name, type: string, nullable: false}
  - {name: type, type: enum, nullable: false, values: [opencast, underground, mixed], note: "brief lists opencast/underground; mixed added for GEM 'Underground & Surface' (see HANDOFF)"}
  - {name: subsidiary_id, type: integer, nullable: false, fk: subsidiary.id}
  - {name: area_id, type: integer, nullable: true, fk: area.id}
  - {name: location, type: wkt_point, nullable: true}
  - {name: boundary, type: string, nullable: true, note: "WKT polygon; no source, always empty"}
  - {name: status, type: enum, nullable: false, values: [active, inactive]}
  - {name: district, type: string, nullable: false}
  - {name: state, type: string, nullable: false}
  - {name: region, type: string, nullable: false}
  - {name: location_quality, type: enum, nullable: false, values: [exact_gem, approx_gem, wikidata, district_centroid]}
  - {name: capacity_mtpa, type: number, nullable: true, note: "GEM capacity; empty for the seed roster"}
  - {name: gem_id, type: string, nullable: true}
