  - {name: contract_id, type: integer, nullable: false, fk: contract.id}
  - {name: name, type: string, nullable: false, note: "fictitious"}
  - {name: worker_code, type: string, nullable: false, unique: true}
  - {name: vt_cert_valid_to, type: date, nullable: false}
  - {name: medical_exam_date, type: date, nullable: false}
  - {name: active, type: boolean, nullable: false}
