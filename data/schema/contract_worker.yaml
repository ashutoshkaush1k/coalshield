table: contract_worker
description: Fictitious contract workers with vocational-training and medical dates.
defined_by:
  - "CLAUDE_CODE_TASK.md Phase 3: contract_worker (contract_id, name, worker_code, vt_cert_valid_to, medical_exam_date, active)"
  - "VT refresher every 4 years: obligations.csv SAF-04 (OSH (Central) Rules 2026 r.159); medical examination annually: HLT-01 (r.109(1)) - via schema/rules.yaml"
generator: gen_contractors.py
primary_key: id
columns:
