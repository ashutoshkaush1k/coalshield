table: sensor_reading
description: Mine sensor readings. Underground and mixed mines get the gas set; opencast mines a reduced set. Thresholds from schema/rules.yaml (obligation-cited) only.
defined_by:
  - "prototype app/models/sensor_reading.py: mine_id, sensor_type, value, unit, recorded_at, breached, resolved, resolved_at (kept)"
  - "CLAUDE_CODE_TASK.md rule 10 / PLAN.md: sensor_reading partitioned by month on recorded_at, PK (id, recorded_at)"
  - "CLAUDE_CODE_DATASETS.md D4: CH4, CO, dust, temperature, humidity; 15-minute intervals for underground mines, reduced set for opencast"
generator: gen_sensors.py
primary_key: id
columns:
  - {name: id, type: integer, nullable: false}
  - {name: mine_id, type: integer, nullable: false, fk: mine.id}
  - {name: sensor_type, type: enum, nullable: false, values: [ch4, ch4_return_air, co, dust, temperature, humidity], note: "temperature = wet bulb"}
  - {name: value, type: number, nullable: false}
  - {name: unit, type: string, nullable: false}
  - {name: recorded_at, type: datetime, nullable: false}
  - {name: breached, type: boolean, nullable: true, note: "empty where no verified legal limit exists (co, humidity)"}
  - {name: resolved, type: boolean, nullable: false}
  - {name: resolved_at, type: datetime, nullable: true}
