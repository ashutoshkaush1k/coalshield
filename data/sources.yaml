- id: S10
  name: Legal texts and their current status
  publisher: Gazette of India, Ministry of Labour & Employment, DGMS, CPCB
  landing_page: https://www.dgms.gov.in/UserView/index?mid=1653
  target_path: raw/legal/
  purpose: Citable status of each instrument; clauses for obligations.csv (D3).
  access: open
  manual: false
  optional: false
  licence: Official Government of India legal texts; the texts of Acts and notifications are public documents
    - reproduction terms TODO-VERIFY
  licence_source: null
  redistribution: raw PDFs stay in raw/ (gitignored); obligations cite clause and page
  notes: 'Status determined from the notifications themselves, each read on 2026-09-25 - see the instruments
    list below. India Code (indiacode.nic.in) does not answer automated clients (its robots.txt times
    out), and the eGazette search page uses a CAPTCHA, so only direct PDF links are used. Status wording
    follows the brief: in force / repealed / subsumed / partly in force. CPCB''s robots.txt disallows
    automated access to its PDFs, so the environmental law text is a manual browser download.'
  instruments:
  - instrument: Occupational Safety, Health and Working Conditions Code, 2020 (37 of 2020)
    status: in force - all provisions, from 2025-11-21
    basis: S.O. 5321(E) dated 21.11.2025, Gazette of India Extraordinary Pt II Sec 3(ii), No. 5145 ("appoints
      the 21st day of November, 2025 as the date on which the provisions of the said Code, shall come
      into force" - no exceptions)
  - instrument: Occupational Safety, Health and Working Conditions (Central) Rules, 2026
    status: in force from 2026-05-08
    basis: G.S.R. 345(E) dated 08.05.2026, Gazette of India Extraordinary Pt II Sec 3(i), No. 311; rule
      1(3) - in force on publication. Draft was G.S.R. 934(E) dated 30.12.2025.
  - instrument: Code on Wages, 2019 (29 of 2019)
    status: partly in force - from 2025-11-21, except the sub-provisions left out of the schedule
    basis: S.O. 5322(E) dated 21.11.2025, Gazette No. 5146 - brings in ss.1-41, 42(4)-(9), 43-66, 67 (listed
      parts), 68, and 69 except serial 3 of S.O. 4604(E) dated 18.12.2020 (S.O. 4604(E) not read - TODO-VERIFY)
  - instrument: Code on Social Security, 2020 (36 of 2020)
    status: partly in force - most provisions from 2025-11-21; some earlier under S.O. 2060(E) of 03.05.2023
    basis: S.O. 5319(E) dated 21.11.2025, Gazette No. 5143, as corrected by S.O. 5936(E) dated 19.12.2025
      (Gazette 20.12.2025, 8589 GI/2025)
  - instrument: Industrial Relations Code, 2020 (35 of 2020)
    status: in force - all provisions, from 2025-11-21
    basis: S.O. 5320(E) dated 21.11.2025, Gazette No. 5144 (no exceptions)
  - instrument: Mines Act, 1952 (35 of 1952)
    status: repealed from 2025-11-21 (subsumed into the OSH Code)
    basis: OSH Code s.143(1)(c), commenced by S.O. 5321(E). Savings, s.143(3) - rules, regulations, notifications
      etc. made under it are deemed made under the Code and "remain in force to the extent they are not
      contrary to the provisions of this Code till they are repealed by the Central Government"; s.143(4)
      applies s.6 of the General Clauses Act, 1897.
  - instrument: Mines Rules, 1955
    status: repealed (superseded) from 2026-05-08; between 2025-11-21 and 2026-05-08 it continued under
      OSH Code s.143(3)
    basis: G.S.R. 345(E) dated 08.05.2026, preamble "in supersession of" item 3, "except as respects things
      done or omitted to be done before such supersession"
  - instrument: Coal Mines Regulations, 2017
    status: in force under the savings clause (deemed made under the OSH Code)
    basis: OSH Code s.143(3); not in the supersession list of G.S.R. 345(E). A replacement, the Draft
      OSH&WC (Coal Mines) Regulations, 2026, was published by DGMS on 31.01.2026 as a draft; no final
      notification was found on DGMS's gazette-notification page on 2026-09-25.
  - instrument: Mines Vocational Training Rules, 1966
    status: repealed (superseded) from 2026-05-08
    basis: G.S.R. 345(E) dated 08.05.2026, preamble "in supersession of" item 5
  - instrument: Contract Labour (Regulation and Abolition) Act, 1970 (37 of 1970)
    status: repealed from 2025-11-21 (subsumed into the OSH Code)
    basis: OSH Code s.143(1)(h), commenced by S.O. 5321(E); savings as for the Mines Act (s.143(3))
  - instrument: Contract Labour (Regulation and Abolition) Central Rules, 1971
    status: repealed (superseded) from 2026-05-08
    basis: G.S.R. 345(E) dated 08.05.2026, preamble "in supersession of" item 8
  - instrument: Employees' Provident Funds and Miscellaneous Provisions Act, 1952 (19 of 1952)
    status: TODO-VERIFY
    basis: Code on Social Security s.164(1) item 3. S.O. 5319(E) as issued commenced items 1-2 and 4-9
      only (item 3 left out); the corrigendum S.O. 5936(E) re-worded that entry to "sub-section (1) of
      section 164 except the provisions of the Code specified at serial number (vi) of S.O.2060(E), dated
      the 3rd May, 2023". S.O. 2060(E) itself was not retrieved from an official source (the EPFO circular
      reproducing it now returns 404), so the effect on the EPF Act is not concluded here. Not in the
      brief's list; included because contractor EPF challans depend on it.
  - instrument: Coal Mines Provident Fund and Miscellaneous Provisions Act, 1948
    status: in force (not repealed by any of the four Codes)
    basis: Not among the enactments repealed by Code on Social Security s.164(1) (read in full - the Act
      is not named anywhere in the Code). Official consolidated text not yet retrieved (India Code unreachable
      to automated clients) - amendments TODO-VERIFY.
  - instrument: Environment (Protection) Act, 1986; Air (Prevention and Control of Pollution) Act, 1981;
      Water (Prevention and Control of Pollution) Act, 1974
    status: in force (outside the labour codes)
    basis: Not among the enactments repealed by OSH Code s.143(1) or Code on Social Security s.164(1)
      (both read). Latest official consolidated text located - CPCB Pollution Control Law Series, 7th
      edition (2021). Amendments after 2021 not verified from an official source - TODO-VERIFY.
